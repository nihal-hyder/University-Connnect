<div style="font-family:Georgia,serif;max-width:520px;margin:0 auto;padding:32px 24px;color:#16181a;background:#f7f4ee">
  <p style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#1f4d3a;margin:0 0 24px">CampusConnect Pakistan</p>
  <h1 style="font-weight:normal;font-size:26px;margin:0 0 16px">Reset your password</h1>
  <p style="font-family:Arial,sans-serif;font-size:15px;line-height:1.6">Someone (hopefully you) asked to reset the password for this account. The link expires in one hour.</p>
  <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password" style="background:#1f4d3a;color:#fff;padding:12px 20px;border-radius:6px;text-decoration:none;font-family:Arial,sans-serif;font-size:15px">Choose a new password</a></p>
  <p style="font-family:Arial,sans-serif;font-size:13px;color:#5b5f62">If you did not request this, you can ignore this email. Your password will not change.</p>
</div>
