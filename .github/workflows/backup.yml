# Weekly logical backup of the production database (roles, schema, data),
# encrypted with a passphrase and kept as a workflow artifact for 30 days.
# The free Supabase plan has no automatic backups, so this is the safety net.
#
# Required repository secrets:
#   SUPABASE_DB_URL     Supabase → Connect → "Session pooler" connection string
#                       (IPv4-compatible; GitHub runners can't reach the direct IPv6 host),
#                       with the database password filled in.
#   BACKUP_PASSPHRASE   a long random string. Store it somewhere safe too:
#                       without it the backups cannot be opened.
#
# Restore: download the artifact, then
#   gpg --batch --passphrase "$BACKUP_PASSPHRASE" -d backup.tar.gz.gpg | tar xz
#   psql "$NEW_DB_URL" -f roles.sql -f schema.sql -c 'SET session_replication_role = replica' -f data.sql
# Test a restore into a fresh project before you rely on it.
name: Database backup
on:
  schedule:
    - cron: "30 21 * * 6" # Saturdays 21:30 UTC (Sunday 02:30 in Pakistan)
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check configuration
        id: config
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "SUPABASE_DB_URL/BACKUP_PASSPHRASE not configured; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.skip != 'true'
        with:
          version: 2.121.0

      - name: Dump and encrypt
        if: steps.config.outputs.skip != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir dump
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/data.sql --use-copy --data-only
          tar czf - -C dump . | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o backup.tar.gz.gpg
          rm -rf dump
          ls -lh backup.tar.gz.gpg

      - uses: actions/upload-artifact@v4
        if: steps.config.outputs.skip != 'true'
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
